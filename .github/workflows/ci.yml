name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # arm64
            qt_arch: clang_64
            qt_version: '6.11.*'  # 開発機の実 Qt（6.11.1）に合わせる
          - os: windows-2022      # x64
            qt_arch: win64_msvc2022_64
            # ワークアラウンド: Qt は 2026-08-02 時点で Windows 向け 6.11.x（6.11.0/6.11.1、
            # および直近の 6.12.0 も同様）のデスクトップバイナリを download.qt.io に公開して
            # いない（`aqt list-qt windows desktop --arch 6.11.1` 等がアーキ一覧を返せず失敗する
            # 一方、`aqt list-qt windows desktop --arch 6.10.3` や
            # `aqt list-qt mac desktop --arch 6.11.1` は正常に解決する）。
            # find_package(Qt6 6.8 REQUIRED ...) は下限指定であり 6.10 系も正当なビルド対象。
            # Windows レグの目的は「MSVC /W4 /WX でこのコードを初めてコンパイルする」ことなので、
            # 上流が Windows 向け 6.11.x を公開するまでの暫定措置として 6.10.* に固定する。
            # 上流で 6.11.x の Windows バイナリが揃ったら 6.11.* に戻すことを検討する。
            qt_version: '6.10.*'
    runs-on: ${{ matrix.os }}
    env:
      # tst_converter が QGuiApplication を要求するため、ヘッドレスランナーでは
      # オフスクリーンプラットフォームプラグインを使う。
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (with qtpdf module)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtpdf' # 明示しないと find_package(Qt6 COMPONENTS Pdf) が失敗する

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        # デフォルトの単一設定ジェネレータ（Unix Makefiles）を使う。成果物は
        # build/app/ 直下に出るため、後続ステップの macdeployqt / 検証パスと一致する。
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUTSUSHI_WERROR=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Visual Studio ジェネレータ（マルチコンフィグ）を明示指定し、デフォルト検出に頼らない。
        # 成果物の実パスは（qt_standard_project_setup() の Windows 向け平坦化により
        # build/app/Release/ にはならない）「Read build layout from CMake」ステップで
        # CMake 自身に確認させる。
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DUTSUSHI_WERROR=ON

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Read build layout from CMake
        # 単一設定（macOS）と複数設定（Windows, Visual Studio）でビルド成果物の実パスが
        # 異なる（Windows は qt_standard_project_setup() が DLL 同居のため全実行ファイルを
        # build/<Config>/ に平坦化し、build/app/Release/ にはならない）。パスをワークフロー
        # 側で推測せず、app/CMakeLists.txt が file(GENERATE) で書き出した実パスを読む。
        shell: bash
        run: |
          set -eu
          layout_file="build/utsushi_layout_Release.txt"
          if [ ! -f "$layout_file" ]; then
            echo "::error::${layout_file} が見つかりません。CMake の configure/generate が失敗している可能性があります。"
            exit 1
          fi
          echo "--- ${layout_file} ---"
          cat "$layout_file"
          grep -E '^(EXECUTABLE|DEPLOY_TARGET|ARTIFACT_DIR)=' "$layout_file" >> "$GITHUB_ENV"

      - name: Verify build output exists
        shell: bash
        run: |
          set -eu
          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::実行ファイルが見つかりません ($EXECUTABLE)。CMake が書き出したパスと実際のビルド出力を確認してください。"
            exit 1
          fi

      - name: Deploy (macOS)
        if: runner.os == 'macOS'
        run: macdeployqt "$DEPLOY_TARGET" -verbose=1

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        run: windeployqt "%DEPLOY_TARGET%"
        shell: cmd

      - name: Verify LICENSE is bundled (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          if [ ! -f "$DEPLOY_TARGET/Contents/Resources/LICENSE" ]; then
            echo "::error::LICENSE が ${DEPLOY_TARGET}/Contents/Resources に同梱されていません。"
            exit 1
          fi

      - name: Verify Qt frameworks deployed (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          if [ ! -d "$DEPLOY_TARGET/Contents/Frameworks/QtCore.framework" ]; then
            echo "::error::macdeployqt が Qt フレームワークを ${DEPLOY_TARGET}/Contents/Frameworks に配置していません。"
            exit 1
          fi

      - name: Verify LICENSE is bundled (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          if [ ! -f "$ARTIFACT_DIR/LICENSE" ]; then
            echo "::error::LICENSE が ${ARTIFACT_DIR} に同梱されていません。"
            exit 1
          fi

      - name: Verify Qt DLLs deployed (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          if ! ls "$ARTIFACT_DIR"/Qt6Core*.dll >/dev/null 2>&1; then
            echo "::error::windeployqt が Qt の DLL を ${ARTIFACT_DIR} に配置していません。"
            exit 1
          fi

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: utsushi-macos-arm64
          path: ${{ env.ARTIFACT_DIR }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: utsushi-windows-x64
          path: ${{ env.ARTIFACT_DIR }}
