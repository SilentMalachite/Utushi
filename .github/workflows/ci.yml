name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # arm64
            qt_arch: clang_64
            qt_version: '6.11.*'  # 開発機の実 Qt（6.11.1）に合わせる
          - os: windows-2022      # x64
            qt_arch: win64_msvc2022_64
            # ワークアラウンド: Qt は 2026-08-02 時点で Windows 向け 6.11.x（6.11.0/6.11.1、
            # および直近の 6.12.0 も同様）のデスクトップバイナリを download.qt.io に公開して
            # いない（`aqt list-qt windows desktop --arch 6.11.1` 等がアーキ一覧を返せず失敗する
            # 一方、`aqt list-qt windows desktop --arch 6.10.3` や
            # `aqt list-qt mac desktop --arch 6.11.1` は正常に解決する）。
            # find_package(Qt6 6.8 REQUIRED ...) は下限指定であり 6.10 系も正当なビルド対象。
            # Windows レグの目的は「MSVC /W4 /WX でこのコードを初めてコンパイルする」ことなので、
            # 上流が Windows 向け 6.11.x を公開するまでの暫定措置として 6.10.* に固定する。
            # 上流で 6.11.x の Windows バイナリが揃ったら 6.11.* に戻すことを検討する。
            qt_version: '6.10.*'
    runs-on: ${{ matrix.os }}
    env:
      # tst_converter が QGuiApplication を要求するため、ヘッドレスランナーでは
      # オフスクリーンプラットフォームプラグインを使う。
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (with qtpdf module)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtpdf' # 明示しないと find_package(Qt6 COMPONENTS Pdf) が失敗する

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        # デフォルトの単一設定ジェネレータ（Unix Makefiles）を使う。成果物は
        # build/app/ 直下に出るため、後続ステップの macdeployqt / 検証パスと一致する。
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUTSUSHI_WERROR=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Visual Studio ジェネレータ（マルチコンフィグ）を明示指定し、デフォルト検出に頼らない。
        # 成果物の実パスは（qt_standard_project_setup() の Windows 向け平坦化により
        # build/app/Release/ にはならない）「Read build layout from CMake」ステップで
        # CMake 自身に確認させる。
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DUTSUSHI_WERROR=ON

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Read build layout from CMake
        # 単一設定（macOS）と複数設定（Windows, Visual Studio）でビルド成果物の実パスが
        # 異なる（Windows は qt_standard_project_setup() が DLL 同居のため全実行ファイルを
        # build/<Config>/ に平坦化し、build/app/Release/ にはならない）。パスをワークフロー
        # 側で推測せず、app/CMakeLists.txt が file(GENERATE) で書き出した実パスを読む。
        shell: bash
        run: |
          set -eu
          layout_file="build/utsushi_layout_Release.txt"
          if [ ! -f "$layout_file" ]; then
            echo "::error::${layout_file} が見つかりません。CMake の configure/generate が失敗している可能性があります。"
            exit 1
          fi
          echo "--- ${layout_file} ---"
          cat "$layout_file"
          grep -E '^(EXECUTABLE|DEPLOY_TARGET|ARTIFACT_DIR)=' "$layout_file" >> "$GITHUB_ENV"

      - name: Verify build output exists
        shell: bash
        run: |
          set -eu
          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::実行ファイルが見つかりません ($EXECUTABLE)。CMake が書き出したパスと実際のビルド出力を確認してください。"
            exit 1
          fi

      - name: Stage Windows distributable
        if: runner.os == 'Windows'
        # Windows のマルチコンフィグ生成物は build/Release/ に app と 5 本のテストバイナリが
        # 平坦化されて同居する（理由は上の「Read build layout from CMake」参照）。そのディレ
        # クトリをそのままアーティファクトにすると tst_*.exe まで配布物に混入してしまう。配布に
        # 必要なファイルだけを新しいディレクトリへ明示的にコピーし（除外リストで弾くのではなく、
        # 出荷するものだけを積む）、windeployqt もそこへ向けて実行する。
        shell: bash
        run: |
          set -eu
          stage_dir="dist/windows"
          mkdir -p "$stage_dir"
          cp "$EXECUTABLE" "$stage_dir/"
          cp "$ARTIFACT_DIR/LICENSE" "$stage_dir/"
          echo "WIN_DIST_DIR=$stage_dir" >> "$GITHUB_ENV"

      - name: Deploy (macOS)
        if: runner.os == 'macOS'
        run: macdeployqt "$DEPLOY_TARGET" -verbose=1

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        # ステージング先の exe を指定する（ビルドツリーの $DEPLOY_TARGET ではない）。
        # DLL・プラグインはステージングディレクトリに直接展開される。
        run: windeployqt "%WIN_DIST_DIR%/utsushi.exe"
        shell: cmd

      - name: Verify LICENSE is bundled (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          if [ ! -f "$DEPLOY_TARGET/Contents/Resources/LICENSE" ]; then
            echo "::error::LICENSE が ${DEPLOY_TARGET}/Contents/Resources に同梱されていません。"
            exit 1
          fi

      - name: Verify Qt frameworks deployed (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          if [ ! -d "$DEPLOY_TARGET/Contents/Frameworks/QtCore.framework" ]; then
            echo "::error::macdeployqt が Qt フレームワークを ${DEPLOY_TARGET}/Contents/Frameworks に配置していません。"
            exit 1
          fi

      - name: Verify no external Qt/Homebrew references (macOS)
        if: runner.os == 'macOS'
        # 受け入れ基準「配布物が Qt 未インストールのクリーンな環境で起動する」の静的側面。
        # bundle 内のすべての Mach-O バイナリ（実行ファイル・フレームワーク本体・プラグイン）
        # を otool -L で走査し、依存先が @rpath/@executable_path/@loader_path 経由か、
        # OS 提供の /usr/lib・/System 配下でなければ失敗させる。ホワイトリスト方式なので、
        # Qt SDK のインストール先が CI と開発機で異なっていても（ハードコードした特定パスに
        # 依存せずに）漏れを検出できる。あわせてメイン実行ファイルの LC_RPATH が
        # @executable_path/../Frameworks のみであることも確認する。
        shell: bash
        run: |
          set -eu
          set -o pipefail

          bundle="$DEPLOY_TARGET"
          status=0
          tab="$(printf '\t')"

          echo "Scanning Mach-O binaries under: $bundle"

          while IFS= read -r -d '' bin; do
            if ! file "$bin" | grep -q "Mach-O"; then
              continue
            fi

            # otool -L はアーキテクチャごとに「<path> (architecture X):」ヘッダーと依存
            # ブロックを繰り返す（universal binary 対応）。ヘッダー行は先頭タブを持たず、
            # 依存エントリ（共有ライブラリ自身の LC_ID_DYLIB 行を含む）は必ず先頭タブを
            # 持つ。この構造上の違いでヘッダーを機械的に除外する（行数を決め打ちで
            # スキップする方式は universal binary で誤検出する）。
            #
            # 共有ライブラリの LC_ID_DYLIB 行を依存とは別扱いで読み飛ばしてはいない。
            # macdeployqt 適用後は自身の id も @rpath/... に書き換わっており、下記の
            # ホワイトリストをそのまま満たすため、依存と同列に扱っても安全。
            while IFS= read -r depline; do
              path=$(echo "$depline" | sed -E 's/^[[:space:]]*([^[:space:]]+).*/\1/')
              [ -z "$path" ] && continue
              case "$path" in
                @rpath/*|@executable_path/*|@loader_path/*|/usr/lib/*|/System/*) ;;
                *)
                  echo "::error::${bin} が bundle 外部を参照しています: ${path}"
                  status=1
                  ;;
              esac
            done < <(otool -L "$bin" | awk -v tab="$tab" 'index($0, tab) == 1')
          done < <(find "$bundle" -type f \( -perm -u+x -o -iname "*.dylib" \) -print0)

          exe="$bundle/Contents/MacOS/utsushi"
          if [ ! -f "$exe" ]; then
            echo "::error::メイン実行ファイルが見つかりません: ${exe}"
            exit 1
          fi

          rpaths=$(otool -l "$exe" | awk '/LC_RPATH/{getline; getline; print $2}')
          if [ -z "$rpaths" ]; then
            echo "::error::${exe} に LC_RPATH がありません。"
            status=1
          fi
          while IFS= read -r rp; do
            [ -z "$rp" ] && continue
            if [ "$rp" != "@executable_path/../Frameworks" ]; then
              echo "::error::想定外の LC_RPATH: ${rp}"
              status=1
            fi
          done <<< "$rpaths"

          if [ "$status" != "0" ]; then
            exit 1
          fi
          echo "OK: すべての依存が @rpath/@executable_path/@loader_path または OS 提供の /usr/lib, /System で解決できます。LC_RPATH も bundle 相対のみです。"

      - name: Verify launch with Qt removed from the environment (macOS)
        if: runner.os == 'macOS'
        # 受け入れ基準の文字どおりの検証: 静的解析では代替できない。QT_QPA_PLATFORM
        # （このジョブの env で offscreen に設定済み）を含む QT_* 環境変数を一切持たない
        # env -i の素の環境で、アップロードされる bundle のコピーを直接起動し、3 秒後も
        # 生きていることを確認する。過去に QT_QPA_PLATFORM=offscreen を残したまま試して
        # 「Could not find the Qt platform plugin "offscreen"」で落ちた（macdeployqt が
        # 展開するのは libqcocoa.dylib のみで libqoffscreen.dylib ではないため）。env -i
        # で子プロセスの環境を完全に作り直すことでこの罠を踏まない。
        shell: bash
        run: |
          set -eu
          set -o pipefail

          launch_dir="$RUNNER_TEMP/qt-free-launch-test"
          rm -rf "$launch_dir"
          mkdir -p "$launch_dir"
          cp -R "$DEPLOY_TARGET" "$launch_dir/utsushi.app"
          binary="$launch_dir/utsushi.app/Contents/MacOS/utsushi"
          chmod +x "$binary"

          stderr_log="$RUNNER_TEMP/qt-free-launch.stderr.log"
          stdout_log="$RUNNER_TEMP/qt-free-launch.stdout.log"
          : > "$stderr_log"
          : > "$stdout_log"

          env -i HOME="$HOME" USER="${USER:-runner}" PATH=/usr/bin:/bin TMPDIR="${TMPDIR:-/tmp}" \
            "$binary" >"$stdout_log" 2>"$stderr_log" &
          pid=$!

          sleep 3

          if kill -0 "$pid" 2>/dev/null; then
            echo "OK: pid ${pid} は Qt を除いた環境で 3 秒後も起動を継続しています。"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 0
          fi

          # 注意: `wait` は素のコマンドとして書くと非ゼロ終了時に set -e で即座に
          # スクリプトを打ち切ってしまい、以下のエラーメッセージと stderr の出力に
          # 到達できない（ローカル検証で実際に踏んだ）。`|| status=$?` で無効化する。
          status=0
          wait "$pid" 2>/dev/null || status=$?
          echo "::error::Qt を除去した環境での起動に失敗しました（exit ${status}）。stderr:"
          cat "$stderr_log" >&2
          echo "::error::stdout:"
          cat "$stdout_log" >&2
          exit 1

      - name: Verify LICENSE is bundled (Windows)
        if: runner.os == 'Windows'
        # ビルドツリーではなく、実際にアップロードするステージングディレクトリを検証する。
        # そうしないとビルドツリーは緑でも出荷物が壊れている、という検証の空振りになる。
        shell: bash
        run: |
          set -eu
          if [ ! -f "$WIN_DIST_DIR/LICENSE" ]; then
            echo "::error::LICENSE が ${WIN_DIST_DIR} に同梱されていません。"
            exit 1
          fi

      - name: Verify Qt DLLs deployed (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          if ! ls "$WIN_DIST_DIR"/Qt6Core*.dll >/dev/null 2>&1; then
            echo "::error::windeployqt が Qt の DLL を ${WIN_DIST_DIR} に配置していません。"
            exit 1
          fi

      - name: Verify no test binaries in Windows distributable
        if: runner.os == 'Windows'
        # 今回の不具合（tst_*.exe が配布物に混入していた）の再発検知用の安全網。ステージング
        # 手順自体は除外リストではなく明示的な積み込みで実装しているため、この検査が失敗する
        # ことがあれば、それはステージングの積み込み側で新たに何かが壊れたことを意味する。
        shell: bash
        run: |
          set -eu
          if ls "$WIN_DIST_DIR"/tst_*.exe >/dev/null 2>&1; then
            echo "::error::テスト実行ファイルが配布物 ${WIN_DIST_DIR} に混入しています。"
            exit 1
          fi

      - name: Verify no missing DLL dependencies (Windows)
        if: runner.os == 'Windows'
        # 受け入れ基準「配布物が Qt 未インストールのクリーンな環境で起動する」の静的側面
        # （macOS 側の "Verify no external Qt/Homebrew references" に対応）。ステージング
        # 済みディレクトリ（$WIN_DIST_DIR。アップロードするものと同一）内のすべての
        # exe/dll について dumpbin /dependents で直接依存を再帰的に辿り、同梱ファイルにも
        # System32 にも存在しない DLL があれば失敗させる。dumpbin は PATH には無いため
        # vswhere で Visual Studio のインストール位置から実パスを解決する。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::error::vswhere.exe が見つかりません: $vswhere"
            exit 1
          }
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1
          if (-not $vsInstall) {
            Write-Host "::error::vswhere が Visual Studio のインストールを見つけられませんでした。"
            exit 1
          }
          $dumpbin = Get-ChildItem -Path "$vsInstall\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -like '*\Hostx64\x64\*' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            Write-Host "::error::dumpbin.exe が見つかりませんでした。"
            exit 1
          }

          $stageDir = (Resolve-Path $env:WIN_DIST_DIR).Path
          $system32 = "$env:SystemRoot\System32"

          function Get-DirectDependencies($binaryPath) {
            $output = & $dumpbin /dependents $binaryPath 2>$null
            $inList = $false
            $names = New-Object System.Collections.Generic.List[string]
            foreach ($line in $output) {
              if ($line -match 'Image has the following dependencies') { $inList = $true; continue }
              if ($inList) {
                $trimmed = $line.Trim()
                if ($trimmed -eq '') { break }
                $names.Add($trimmed)
              }
            }
            return $names
          }

          $stagedFiles = Get-ChildItem -Path $stageDir -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' }
          $stagedByName = @{}
          foreach ($f in $stagedFiles) { $stagedByName[$f.Name.ToLowerInvariant()] = $f.FullName }

          $visited = New-Object System.Collections.Generic.HashSet[string]
          $queue = New-Object System.Collections.Generic.Queue[string]
          foreach ($f in $stagedFiles) { $queue.Enqueue($f.FullName) }

          $missing = New-Object System.Collections.Generic.List[object]

          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            $key = $current.ToLowerInvariant()
            if ($visited.Contains($key)) { continue }
            [void]$visited.Add($key)

            foreach ($dep in (Get-DirectDependencies $current)) {
              $depLower = $dep.ToLowerInvariant()

              # api-ms-win-*/ext-ms-* は Windows のバージョン管理機構（apisetschema）が
              # 解決するフォワーダで、System32 に実ファイルとして存在するとは限らない。
              # Windows 10 以降では常に解決可能とみなせる。
              if ($depLower -like 'api-ms-win-*' -or $depLower -like 'ext-ms-*') { continue }

              if ($stagedByName.ContainsKey($depLower)) {
                $depPath = $stagedByName[$depLower]
                if (-not $visited.Contains($depPath.ToLowerInvariant())) {
                  $queue.Enqueue($depPath)
                }
                continue
              }

              if (Test-Path (Join-Path $system32 $dep)) { continue }

              $missing.Add([PSCustomObject]@{ Binary = $current; Dependency = $dep })
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::配布物に含まれない DLL 依存が見つかりました:"
            foreach ($m in $missing) {
              Write-Host "::error::  $($m.Binary) -> $($m.Dependency)"
            }
            exit 1
          }

          Write-Host "OK: $stageDir 配下のすべての exe/dll の依存が、同梱ファイルまたは System32 で解決できます。"

      - name: Verify launch with Qt removed from the environment (Windows)
        if: runner.os == 'Windows'
        # 受け入れ基準の文字どおりの検証: 静的解析では代替できない（macOS 側の
        # "Verify launch with Qt removed from the environment" に対応）。install-qt-action
        # が PATH に追加した Qt の bin ディレクトリ（$QT_ROOT_DIR\bin）を除いた PATH と、
        # QT_* を一切含まない環境変数だけで exe を起動し、3 秒後も生きていることを確認
        # する。即座に終了した場合は stdout/stderr を出力して失敗させる。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exePath = Join-Path $env:WIN_DIST_DIR 'utsushi.exe'
          if (-not (Test-Path $exePath)) {
            Write-Host "::error::実行ファイルが見つかりません: $exePath"
            exit 1
          }
          $exePath = (Resolve-Path $exePath).Path

          # install-qt-action が設定する QT_ROOT_DIR（Qt インストールのルート）から
          # bin ディレクトリを特定し、PATH から取り除く。
          $qtBin = $null
          if ($env:QT_ROOT_DIR) { $qtBin = (Join-Path $env:QT_ROOT_DIR 'bin').TrimEnd('\') }

          $filteredPath = ($env:PATH -split ';' | Where-Object {
            $_ -and (-not $qtBin -or $_.TrimEnd('\') -ne $qtBin)
          }) -join ';'

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exePath
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardOutput = $true
          $psi.EnvironmentVariables.Clear()

          # OS が動作するのに必要な最小限の環境変数だけを引き継ぐ。QT_ROOT_DIR /
          # QT_PLUGIN_PATH / QML2_IMPORT_PATH / PKG_CONFIG_PATH / LD_LIBRARY_PATH /
          # IQTA_TOOLS など install-qt-action が設定したものは一切引き継がない。
          $keep = @('SystemRoot', 'windir', 'ComSpec', 'PATHEXT', 'TEMP', 'TMP',
                    'USERPROFILE', 'ProgramData', 'SystemDrive', 'ALLUSERSPROFILE',
                    'NUMBER_OF_PROCESSORS', 'PROCESSOR_ARCHITECTURE',
                    'PROCESSOR_IDENTIFIER', 'OS')
          foreach ($name in $keep) {
            $val = [System.Environment]::GetEnvironmentVariable($name)
            if ($val) { $psi.EnvironmentVariables[$name] = $val }
          }
          $psi.EnvironmentVariables['PATH'] = $filteredPath

          $leaked = $psi.EnvironmentVariables.Keys | Where-Object { $_ -like 'QT_*' }
          if ($leaked) {
            Write-Host "::error::子プロセスの環境に QT_* 変数が残っています: $($leaked -join ', ')"
            exit 1
          }

          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi
          [void]$proc.Start()

          Start-Sleep -Seconds 3

          if (-not $proc.HasExited) {
            Write-Host "OK: pid $($proc.Id) は Qt を除いた環境で 3 秒後も起動を継続しています。"
            $proc.Kill()
            $proc.WaitForExit(5000) | Out-Null
            exit 0
          }

          $stderrText = $proc.StandardError.ReadToEnd()
          $stdoutText = $proc.StandardOutput.ReadToEnd()
          Write-Host "::error::Qt を除去した環境での起動に失敗しました (exit code $($proc.ExitCode))。"
          Write-Host "--- stdout ---"
          Write-Host $stdoutText
          Write-Host "--- stderr ---"
          Write-Host $stderrText
          exit 1

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: utsushi-macos-arm64
          path: ${{ env.ARTIFACT_DIR }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: utsushi-windows-x64
          path: ${{ env.WIN_DIST_DIR }}
